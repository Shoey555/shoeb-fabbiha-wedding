<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101610">
  <meta name="description" content="The wedding invitation of Shoeb & Fabbiha — 31 March 2027.">
  <title>Shoeb & Fabbiha | Wedding Invitation</title>
  <style>
    :root { color-scheme: dark; --gold: #d9c18c; --gold-bright: #ead9ae; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101610; }
    body {
      min-height: 100svh; overflow: hidden; color: var(--gold-bright);
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(ellipse at 50% 35%, #263629 0%, #172219 44%, #090d0a 100%);
    }
    .screen {
      min-height: 100svh; min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      gap: 18px; position: relative; isolation: isolate;
    }
    .screen::before {
      content: ""; position: absolute; inset: 14px; border: 1px solid rgba(217,193,140,.35);
      pointer-events: none; z-index: -1;
    }
    .video-wrap {
      width: min(100%, 780px); aspect-ratio: 16 / 9; position: relative; overflow: hidden;
      background: #050705; box-shadow: 0 18px 65px rgba(0,0,0,.48);
      border: 1px solid rgba(217,193,140,.45);
    }
    .video-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
    .copy { text-align: center; text-shadow: 0 2px 16px rgba(0,0,0,.65); }
    .names { font-size: clamp(25px, 6vw, 43px); letter-spacing: .13em; margin: 0; font-weight: 400; }
    .date { margin: 10px 0 0; font: 500 12px/1.5 Arial, sans-serif; letter-spacing: .28em; color: var(--gold); }
    .enter {
      display: inline-flex; align-items: center; justify-content: center; min-height: 52px;
      padding: 0 30px; border: 1px solid var(--gold); border-radius: 2px;
      color: #f1e5c9; background: rgba(13,20,14,.72); text-decoration: none;
      font: 600 11px/1 Arial, sans-serif; letter-spacing: .2em;
      transition: background .2s ease, transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .enter:active { transform: scale(.98); background: rgba(217,193,140,.18); }
    .hint { margin: -7px 0 0; color: rgba(234,217,174,.7); font: 10px/1.5 Arial, sans-serif; letter-spacing: .12em; text-align:center; }
    @media (max-width: 600px) {
      .screen { justify-content: center; gap: 16px; padding-left: 25px; padding-right: 25px; }
      .video-wrap { width: 100%; }
      .names { letter-spacing: .09em; }
    }
    @media (prefers-reduced-motion: reduce) { .enter { transition: none; } }
  </style>
</head>
<body>
  <main class="screen">
    <div class="video-wrap" aria-label="Wedding introduction video">
      <iframe
        src="https://www.youtube-nocookie.com/embed/Jady2174wTY?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1"
        title="Shoeb and Fabbiha wedding introduction"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
    <div class="copy">
      <h1 class="names">SHOEB &amp; FABBIHA</h1>
      <p class="date">31 MARCH 2027</p>
    </div>
    <a class="enter" href="https://withjoy.com/shoeb-and-fabbiha-mar-2027" rel="noopener">
      ENTER INVITATION&nbsp; &rarr;
    </a>
    <p class="hint">PLEASE TAP TO CONTINUE</p>
  </main>
</body>
</html>
