<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#080d09"><meta name="description" content="Join Shoeb & Fabbiha for their wedding celebration, 31 March 2027."><title>Shoeb & Fabbiha · Wedding Invitation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#080d09;color:#efdfb7}body{font-family:Georgia,'Times New Roman',serif}.invitation{min-height:100svh;position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding: max(24px,env(safe-area-inset-top)) 24px max(34px,env(safe-area-inset-bottom))}.ambience{position:absolute;inset:-30px;z-index:-3;background:linear-gradient(#09100b44,#080d09),url('poster.jpg') center/cover;filter:blur(24px);opacity:.5}.film{position:absolute;inset:0 0 auto;width:100%;height:64svh;object-fit:contain;z-index:-2;mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 65%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 65%,transparent 100%)}.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,transparent 30%,#080d0922 45%,#080d09ed 76%,#080d09)}.copy{width:100%;text-align:center;padding-top:46svh;animation:arrive 1.8s ease both}.eyebrow,.date,.enter,.note,.replay{font-family:Arial,sans-serif}.eyebrow{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#d5bc85;margin:0 0 19px}h1{font-weight:400;font-size:clamp(39px,11vw,64px);line-height:1.04;letter-spacing:.025em;margin:0;text-shadow:0 2px 28px #000}h1 span{display:block}.amp{font-size:.55em;font-style:italic;color:#ba995d;margin:8px 0}.date{font-size:10px;letter-spacing:.27em;margin:22px 0;color:#d9c595}.line{width:46px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,#c5a56a,transparent)}.enter{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:0 28px;border:1px solid #b8975c;color:#f1dfb8;background:#18221988;text-decoration:none;font-size:10px;letter-spacing:.2em;transition:background .2s}.enter:hover,.enter:focus-visible{background:#3d452b;outline:2px solid #efdfb7;outline-offset:4px}.note{font-size:9px;color:#a69b7d;letter-spacing:.08em;margin:16px 0 0}.replay{position:absolute; </style></head><body><main class="invitation"><div class="ambience" aria-hidden="true"></div><video class="film" id="film" autoplay muted playsinline preload="auto" poster="poster.jpg" aria-label="Golden arch with Bismillah calligraphy"><source src="intro.mp4" type="video/mp4"></video><div class="shade" aria-hidden="true"></div><button class="replay" id="replay" hidden>Play introduction</button><section class="copy" aria-label="Wedding invitation"><p class="eyebrow">The wedding celebration of</p><h1><span>Shoeb</span><span class="amp">&amp;</span><span>Fabbiha</span></h1><p class="date">31 MARCH 2027</p><div class="line" aria-hidden="true"></div><a class="enter" href="https://withjoy.com/shoeb-and-fabbiha-mar-2027">ENTER INVITATION &nbsp; →</a><p class="note">With the blessings of Allah</p></section></main><script>
